<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 영상 갤러리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#0f1012; --panel:#17181b; --panel2:#1e2024; --line:#2a2d33;
    --text:#eceef1; --muted:#9097a1; --accent:#7c9cff; --accent2:#a98bff; --danger:#ff6b6b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:10;background:rgba(15,16,18,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;gap:12px;height:64px}
  .logo{font-weight:800;font-size:18px;letter-spacing:-.02em}
  .logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:4px}
  .live i{width:7px;height:7px;border-radius:50%;background:#555}
  .live.on i{background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.18)}
  .spacer{flex:1}
  .me{font-size:14px;color:var(--muted)}
  .me b{color:var(--text)}
  .btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
  .btn:hover{background:#25282d}
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:0;color:#0b0c10}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:none;border:0;color:var(--muted);padding:6px 8px}
  .btn.ghost:hover{color:var(--text)}

  .hero{padding:36px 0 18px}
  .hero h1{margin:0 0 6px;font-size:28px;letter-spacing:-.03em}
  .hero p{margin:0;color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
  .chip{padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
  .chip.active{color:var(--text);border-color:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:18px 0 80px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s ease,border-color .2s ease}
  .card:hover{transform:translateY(-2px);border-color:#3a3e46}
  .card.new{animation:pop .5s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .thumb{aspect-ratio:16/10;background:#000;position:relative}
  .thumb video{width:100%;height:100%;object-fit:cover;display:block}
  .badge{position:absolute;right:8px;bottom:8px;font-size:12px;background:rgba(0,0,0,.65);padding:3px 8px;border-radius:999px}
  .card .meta{padding:12px 14px 14px}
  .card h3{margin:0 0 6px;font-size:16px;line-height:1.35;letter-spacing:-.01em}
  .card .sub{display:flex;gap:8px;font-size:13px;color:var(--muted);align-items:center}
  .tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tool{font-size:11.5px;padding:3px 8px;border-radius:6px;background:rgba(124,156,255,.12);color:#b9c8ff}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:80px 0}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
  .modal.wide{max-width:1100px}
  .modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0;font-size:18px}
  .modal-body{padding:20px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  label:first-child{margin-top:0}
  input[type=text],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
  input[type=text]:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:84px;line-height:1.5}
  .drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:var(--panel2)}
  .drop.has{border-style:solid;border-color:var(--accent);color:var(--text)}
  .drop video{max-width:100%;max-height:200px;border-radius:8px;margin-top:10px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:1em}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

  .detail{display:grid;grid-template-columns:1.4fr 1fr;min-height:540px}
  .detail .left{background:#000;display:flex;align-items:center;justify-content:center}
  .detail .left video{width:100%;max-height:80vh;display:block}
  .detail .right{display:flex;flex-direction:column;border-left:1px solid var(--line);min-height:0;max-height:88vh}
  .detail .info{padding:18px 20px;border-bottom:1px solid var(--line);overflow:auto}
  .detail .info h2{margin:0 0 6px;font-size:20px}
  .sec{margin-top:14px}
  .sec h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
  .sec pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:14px;line-height:1.6;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .sec .text{white-space:pre-wrap;font-size:14px;line-height:1.65}
  .comments{flex:1;overflow:auto;padding:14px 20px;min-height:160px}
  .cmt{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .cmt .who{font-size:13px;font-weight:700}
  .cmt .who small{font-weight:400;color:var(--muted);margin-left:6px}
  .cmt .body{font-size:14px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
  .cmt .del{float:right}
  .cform{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .cform input{flex:1}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#22252a;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:100;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .progress{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:12px;display:none}
  .progress div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}

  .pagedrop{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
    background:rgba(15,16,18,.82);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s ease}
  .pagedrop.show{opacity:1}
  .pagedrop .box{border:2px dashed var(--accent);border-radius:24px;padding:56px 72px;text-align:center;
    transform:scale(.97);transition:transform .25s ease}
  .pagedrop.show .box{transform:none}
  .pagedrop .big{font-size:44px;margin-bottom:10px}
  .pagedrop b{display:block;font-size:22px;margin-bottom:6px}
  .pagedrop span{color:var(--muted)}

  @media (max-width:820px){
    .detail{grid-template-columns:1fr}
    .detail .right{border-left:0;border-top:1px solid var(--line);max-height:none}
    .hero h1{font-size:22px}
    .me{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo">🎬 <span>우리 반 영상 갤러리</span></div>
    <div class="live" id="live"><i></i><span>연결 중</span></div>
    <div class="spacer"></div>
    <div class="me" id="me"></div>
    <button class="btn ghost" id="renameBtn">닉네임 변경</button>
    <button class="btn primary" id="uploadBtn">+ 영상 올리기</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>오늘 만든 영상을 올리고 서로 구경해요</h1>
    <p>어떻게 만들었는지 함께 적어 주면 친구들이 따라 해볼 수 있어요. 새 글과 댓글은 실시간으로 올라옵니다.<br>영상 파일을 이 화면 아무 데나 끌어다 놓으면 바로 올릴 수 있어요.</p>
    <div class="filters" id="filters"></div>
  </section>
  <section class="grid" id="grid"><div class="empty">불러오는 중…</div></section>
</main>

<!-- 닉네임 -->
<div class="overlay" id="nickModal">
  <div class="modal">
    <div class="modal-head"><h2>반가워요! 이름을 알려주세요</h2></div>
    <div class="modal-body">
      <label for="nickInput">닉네임 (영상과 댓글에 표시돼요)</label>
      <input type="text" id="nickInput" maxlength="20" placeholder="예: 김범">
      <div class="err" id="nickErr"></div>
      <div class="actions"><button class="btn primary" id="nickSave">시작하기</button></div>
    </div>
  </div>
</div>

<!-- 업로드 -->
<div class="overlay" id="upModal">
  <div class="modal">
    <div class="modal-head"><h2>영상 올리기</h2><div class="spacer"></div><button class="btn ghost" data-close>✕</button></div>
    <div class="modal-body">
      <label>영상 파일 (최대 50MB)</label>
      <div class="drop" id="drop">여기를 눌러 영상을 고르거나 끌어다 놓으세요<input type="file" id="file" accept="video/*" hidden></div>
      <label for="fTitle">제목</label>
      <input type="text" id="fTitle" maxlength="60" placeholder="예: 우주를 나는 고양이">
      <label for="fTools">사용한 도구 (쉼표로 구분)</label>
      <input type="text" id="fTools" maxlength="120" placeholder="예: Higgsfield, CapCut">
      <label for="fPrompt">사용한 프롬프트</label>
      <textarea id="fPrompt" placeholder="AI에 입력한 프롬프트를 그대로 붙여넣어 주세요"></textarea>
      <label for="fHow">어떻게 만들었나요?</label>
      <textarea id="fHow" placeholder="1. 이미지를 먼저 만들고&#10;2. 영상으로 움직이게 하고&#10;3. 자막을 넣었어요"></textarea>
      <div class="progress" id="prog"><div></div></div>
      <div class="err" id="upErr"></div>
      <div class="actions"><button class="btn" data-close>취소</button><button class="btn primary" id="upSubmit">올리기</button></div>
    </div>
  </div>
</div>

<!-- 상세 -->
<div class="overlay" id="detailModal">
  <div class="modal wide">
    <div class="detail">
      <div class="left"><video id="dVideo" controls playsinline loop></video></div>
      <div class="right">
        <div class="info" id="dInfo"></div>
        <div class="comments" id="dComments"></div>
        <form class="cform" id="cForm">
          <input type="text" id="cInput" maxlength="300" placeholder="댓글을 남겨 보세요" autocomplete="off">
          <button class="btn primary" type="submit">등록</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="pagedrop" id="pagedrop"><div class="box"><div class="big">🎬</div><b>여기에 놓아서 영상 올리기</b><span>영상 파일 · 최대 50MB</span></div></div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://xzejhtggfrwaazvmkokw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6ZWpodGdnZnJ3YWF6dm1rb2t3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2Nzc1NjYsImV4cCI6MjExMTI1MzU2Nn0.ipct6SMF-Wcph9nknjaFoot5CkVgQxJewGW7zIIsRDo";
const MAX_BYTES = 50 * 1024 * 1024;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }
let me = { id: store("cvs_id"), nick: store("cvs_nick") };
if(!me.id){ me.id = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)); store("cvs_id", me.id); }

let posts = [];
let counts = {};          // post_id -> comment count
let filterNick = null;
let openPost = null;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function ago(ts){
  const s = (Date.now()-new Date(ts))/1000;
  if(s<60) return "방금"; if(s<3600) return Math.floor(s/60)+"분 전";
  if(s<86400) return Math.floor(s/3600)+"시간 전"; return new Date(ts).toLocaleDateString("ko-KR");
}
function show(id){ $(id).classList.add("show"); }
function hide(id){ $(id).classList.remove("show"); }
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".overlay").classList.remove("show"));
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("mousedown",e=>{ if(e.target===o && o.id!=="nickModal"){ o.classList.remove("show"); if(o.id==="detailModal") closeDetail(); } }));
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#detailModal").classList.contains("show")) closeDetail(); hide("#upModal"); } });

/* 닉네임 */
function renderMe(){ $("#me").innerHTML = me.nick ? `<b>${esc(me.nick)}</b> 님` : ""; }
function askNick(){ $("#nickInput").value = me.nick || ""; show("#nickModal"); setTimeout(()=>$("#nickInput").focus(),50); }
$("#nickSave").onclick = () => {
  const v = $("#nickInput").value.trim();
  if(!v){ $("#nickErr").textContent="닉네임을 입력해 주세요"; return; }
  me.nick = v; store("cvs_nick", v); hide("#nickModal"); renderMe();
  if(pendingFile){ const f = pendingFile; pendingFile = null; openUploadWith(f); }
};
$("#nickInput").addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.isComposing) $("#nickSave").click(); });
$("#renameBtn").onclick = askNick;

/* 목록 */
function renderFilters(){
  const names = [...new Set(posts.map(p=>p.nickname))];
  const f = $("#filters");
  f.innerHTML = `<button class="chip ${!filterNick?"active":""}" data-n="">전체 ${posts.length}</button>` +
    names.map(n=>`<button class="chip ${filterNick===n?"active":""}" data-n="${esc(n)}">${esc(n)} ${posts.filter(p=>p.nickname===n).length}</button>`).join("");
  f.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ filterNick = c.dataset.n || null; render(); });
}
function cardHTML(p){
  const tools = (p.tools||"").split(",").map(s=>s.trim()).filter(Boolean);
  return `<article class="card" data-id="${p.id}">
    <div class="thumb"><video src="${esc(p.video_url)}#t=0.5" muted playsinline preload="metadata"></video>
      <span class="badge">💬 ${counts[p.id]||0}</span></div>
    <div class="meta"><h3>${esc(p.title)}</h3>
      <div class="sub"><span>${esc(p.nickname)}</span><span>·</span><span>${ago(p.created_at)}</span></div>
      ${tools.length?`<div class="tools">${tools.map(t=>`<span class="tool">${esc(t)}</span>`).join("")}</div>`:""}
    </div></article>`;
}
function render(newId){
  renderFilters();
  const list = filterNick ? posts.filter(p=>p.nickname===filterNick) : posts;
  const g = $("#grid");
  if(!list.length){ g.innerHTML = `<div class="empty">아직 올라온 영상이 없어요. 첫 번째로 올려 보세요!</div>`; return; }
  g.innerHTML = list.map(cardHTML).join("");
  g.querySelectorAll(".card").forEach(c=>{
    if(c.dataset.id===newId) c.classList.add("new");
    const v = c.querySelector("video");
    c.onmouseenter = ()=>{ v.play().catch(()=>{}); };
    c.onmouseleave = ()=>{ v.pause(); };
    c.onclick = ()=>openDetail(c.dataset.id);
  });
}
async function load(){
  const { data, error } = await sb.from("posts").select("*").order("created_at",{ascending:false});
  if(error){ $("#grid").innerHTML = `<div class="empty">불러오지 못했어요: ${esc(error.message)}</div>`; return; }
  posts = data;
  const { data: cs } = await sb.from("comments").select("post_id");
  counts = {}; (cs||[]).forEach(c=>counts[c.post_id]=(counts[c.post_id]||0)+1);
  render();
}

/* 업로드 */
let pickedFile = null;
const drop = $("#drop"), fileIn = $("#file");
drop.onclick = ()=>fileIn.click();
drop.ondragover = e=>{ e.preventDefault(); drop.classList.add("has"); };
drop.ondragleave = ()=>{ if(!pickedFile) drop.classList.remove("has"); };
drop.ondrop = e=>{ e.preventDefault(); e.stopPropagation(); hidePageDrop(); pick(e.dataTransfer.files[0]); };

/* 화면 어디에나 끌어다 놓기 */
let dragDepth = 0, pendingFile = null;
const pageDrop = $("#pagedrop");
const hasFiles = e => [...(e.dataTransfer?.types||[])].includes("Files");
function hidePageDrop(){ dragDepth = 0; pageDrop.classList.remove("show"); }
window.addEventListener("dragenter", e=>{
  if(!hasFiles(e)) return; e.preventDefault();
  dragDepth++;
  if(!$("#upModal").classList.contains("show")) pageDrop.classList.add("show");
});
window.addEventListener("dragover", e=>{ if(hasFiles(e)) e.preventDefault(); });
window.addEventListener("dragleave", e=>{ if(!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth-1); if(!dragDepth) hidePageDrop(); });
window.addEventListener("drop", e=>{
  if(!hasFiles(e)) return; e.preventDefault(); hidePageDrop();
  const f = e.dataTransfer.files[0]; if(!f) return;
  if(!f.type.startsWith("video/")) return toast("영상 파일만 올릴 수 있어요");
  if($("#detailModal").classList.contains("show")) closeDetail();
  if(!me.nick){ pendingFile = f; return askNick(); }
  openUploadWith(f);
});
function openUploadWith(f){ show("#upModal"); pick(f); setTimeout(()=>$("#fTitle").focus(),50); }
fileIn.onchange = ()=>pick(fileIn.files[0]);
function pick(f){
  $("#upErr").textContent = "";
  if(!f) return;
  if(!f.type.startsWith("video/")){ $("#upErr").textContent="영상 파일만 올릴 수 있어요"; return; }
  if(f.size > MAX_BYTES){ $("#upErr").textContent=`용량이 커요 (${(f.size/1048576).toFixed(1)}MB). 50MB 이하로 줄여서 올려 주세요. 1080p로 내보내면 대부분 해결돼요.`; return; }
  pickedFile = f;
  drop.classList.add("has");
  drop.innerHTML = `<b>${esc(f.name)}</b> · ${(f.size/1048576).toFixed(1)}MB<br><video src="${URL.createObjectURL(f)}" muted autoplay loop playsinline></video><div class="hint">다른 파일을 고르려면 다시 누르세요</div>`;
  drop.appendChild(fileIn);
  if(!$("#fTitle").value) $("#fTitle").value = f.name.replace(/\.[^.]+$/,"");
}
function resetUpload(){
  pickedFile=null; fileIn.value=""; drop.classList.remove("has");
  drop.innerHTML="여기를 눌러 영상을 고르거나 끌어다 놓으세요"; drop.appendChild(fileIn);
  ["#fTitle","#fTools","#fPrompt","#fHow"].forEach(s=>$(s).value="");
  $("#upErr").textContent=""; $("#prog").style.display="none"; $("#prog div").style.width="0";
}
$("#uploadBtn").onclick = ()=>{ if(!me.nick) return askNick(); show("#upModal"); };

function uploadWithProgress(path, file, onProgress){
  // supabase-js 업로드는 진행률이 없어 XHR로 직접 올림
  return new Promise((resolve,reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `${SUPABASE_URL}/storage/v1/object/videos/${path}`);
    xhr.setRequestHeader("Authorization", `Bearer ${SUPABASE_ANON_KEY}`);
    xhr.setRequestHeader("apikey", SUPABASE_ANON_KEY);
    xhr.setRequestHeader("Content-Type", file.type || "video/mp4");
    xhr.setRequestHeader("x-upsert", "false");
    xhr.upload.onprogress = e=>{ if(e.lengthComputable) onProgress(e.loaded/e.total); };
    xhr.onload = ()=> xhr.status<300 ? resolve() : reject(new Error((()=>{ try{return JSON.parse(xhr.responseText).message}catch(e){return xhr.statusText} })()));
    xhr.onerror = ()=>reject(new Error("네트워크 오류"));
    xhr.send(file);
  });
}
$("#upSubmit").onclick = async ()=>{
  const title = $("#fTitle").value.trim();
  if(!pickedFile){ $("#upErr").textContent="영상을 골라 주세요"; return; }
  if(!title){ $("#upErr").textContent="제목을 입력해 주세요"; return; }
  const btn = $("#upSubmit"); btn.disabled = true; btn.textContent = "올리는 중…";
  $("#upErr").textContent=""; $("#prog").style.display="block";
  try{
    const ext = (pickedFile.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"") || "mp4";
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    await uploadWithProgress(path, pickedFile, r=>$("#prog div").style.width=(r*100).toFixed(0)+"%");
    const { data:{ publicUrl } } = sb.storage.from("videos").getPublicUrl(path);
    const { error } = await sb.from("posts").insert({
      author_id: me.id, nickname: me.nick, title,
      tools: $("#fTools").value.trim(), prompt: $("#fPrompt").value.trim(), how_made: $("#fHow").value.trim(),
      video_path: path, video_url: publicUrl
    });
    if(error) throw error;
    hide("#upModal"); resetUpload(); toast("영상이 올라갔어요 🎉");
  }catch(e){
    $("#upErr").textContent = "업로드 실패: " + e.message;
  }finally{ btn.disabled=false; btn.textContent="올리기"; }
};

/* 상세 + 댓글 */
async function openDetail(id){
  const p = posts.find(x=>x.id===id); if(!p) return;
  openPost = p;
  $("#dVideo").src = p.video_url;
  $("#dVideo").play().catch(()=>{});
  const tools = (p.tools||"").split(",").map(s=>s.trim()).filter(Boolean);
  $("#dInfo").innerHTML = `
    <h2>${esc(p.title)}</h2>
    <div class="sub" style="display:flex;gap:8px;color:var(--muted);font-size:13px;align-items:center">
      <span>${esc(p.nickname)}</span><span>·</span><span>${ago(p.created_at)}</span>
      ${p.author_id===me.id?`<span style="flex:1"></span><button class="btn ghost" id="delPost" style="color:var(--danger)">삭제</button>`:""}
    </div>
    ${tools.length?`<div class="tools">${tools.map(t=>`<span class="tool">${esc(t)}</span>`).join("")}</div>`:""}
    ${p.prompt?`<div class="sec"><h4>프롬프트</h4><pre>${esc(p.prompt)}</pre></div>`:""}
    ${p.how_made?`<div class="sec"><h4>만든 과정</h4><div class="text">${esc(p.how_made)}</div></div>`:""}`;
  const del = $("#delPost");
  if(del) del.onclick = async ()=>{
    if(del.dataset.armed!=="1"){ del.dataset.armed="1"; del.textContent="한 번 더 누르면 삭제"; return; }
    await sb.storage.from("videos").remove([p.video_path]);
    const { error } = await sb.from("posts").delete().eq("id", p.id);
    if(error) return toast("삭제 실패: "+error.message);
    closeDetail(); toast("삭제했어요");
  };
  $("#dComments").innerHTML = `<div class="hint">댓글 불러오는 중…</div>`;
  show("#detailModal");
  const { data } = await sb.from("comments").select("*").eq("post_id", id).order("created_at");
  if(openPost?.id!==id) return;
  renderComments(data||[]);
}
let curComments = [];
function renderComments(list){
  curComments = list;
  const box = $("#dComments");
  if(!list.length){ box.innerHTML = `<div class="hint">첫 댓글을 남겨 보세요 ✍️</div>`; return; }
  box.innerHTML = list.map(c=>`<div class="cmt">
      ${c.author_id===me.id?`<button class="btn ghost del" data-id="${c.id}">삭제</button>`:""}
      <div class="who">${esc(c.nickname)}<small>${ago(c.created_at)}</small></div>
      <div class="body">${esc(c.body)}</div></div>`).join("");
  box.querySelectorAll(".del").forEach(b=>b.onclick=()=>sb.from("comments").delete().eq("id",b.dataset.id));
  box.scrollTop = box.scrollHeight;
}
function closeDetail(){ hide("#detailModal"); $("#dVideo").pause(); $("#dVideo").removeAttribute("src"); openPost=null; }
$("#cForm").onsubmit = async e=>{
  e.preventDefault();
  if(!me.nick) return askNick();
  const body = $("#cInput").value.trim(); if(!body || !openPost) return;
  $("#cInput").value = "";
  const { error } = await sb.from("comments").insert({ post_id: openPost.id, author_id: me.id, nickname: me.nick, body });
  if(error){ toast("댓글 실패: "+error.message); $("#cInput").value = body; }
};

/* 실시간 */
sb.channel("class-room")
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"posts"},({new:p})=>{
    if(posts.some(x=>x.id===p.id)) return;
    posts.unshift(p); render(p.id);
    if(p.author_id!==me.id) toast(`${p.nickname} 님이 새 영상을 올렸어요`);
  })
  .on("postgres_changes",{event:"DELETE",schema:"public",table:"posts"},({old})=>{
    posts = posts.filter(x=>x.id!==old.id); render();
    if(openPost?.id===old.id) closeDetail();
  })
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"comments"},({new:c})=>{
    counts[c.post_id]=(counts[c.post_id]||0)+1; updateBadge(c.post_id);
    if(openPost?.id===c.post_id && !curComments.some(x=>x.id===c.id)) renderComments([...curComments, c]);
  })
  .on("postgres_changes",{event:"DELETE",schema:"public",table:"comments"},({old})=>{
    if(old.post_id){ counts[old.post_id]=Math.max(0,(counts[old.post_id]||1)-1); updateBadge(old.post_id); }
    if(curComments.some(x=>x.id===old.id)) renderComments(curComments.filter(x=>x.id!==old.id));
  })
  .subscribe(status=>{
    const on = status==="SUBSCRIBED";
    $("#live").classList.toggle("on", on);
    $("#live span").textContent = on ? "실시간 연결됨" : "연결 중";
  });
function updateBadge(pid){ const b=document.querySelector(`.card[data-id="${pid}"] .badge`); if(b) b.textContent=`💬 ${counts[pid]||0}`; }
setInterval(()=>document.querySelectorAll(".card").length && render(), 60000);

renderMe();
if(!me.nick) askNick();
load();
</script>
