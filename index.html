<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 제품 영상 크리틱</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
  :root{
    --paper:#f3f2ee; --sheet:#fbfaf8; --ink:#151515; --ink2:#3b3a37; --muted:#77756f; --line:#dad8d1; --line2:#c9c6bd;
    --danger:#c2341f;
    --ease:cubic-bezier(.22,.8,.24,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:break-word}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  .wrap{max-width:1280px;margin:0 auto;padding:0 32px}

  /* 상단 바: 종이 위에 떠 있는 반투명 층, 스크롤하면 아래 경계만 살짝 */
  header{position:sticky;top:0;z-index:10;background:rgba(243,242,238,.82);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);transition:box-shadow .2s ease}
  header.scrolled{box-shadow:0 1px 0 var(--line)}
  header .wrap{display:flex;align-items:center;gap:20px;height:60px}
  .brand{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .brand span{font-weight:400;color:var(--muted);margin-left:8px}
  .spacer{flex:1}

  .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line2);flex:none}
  .live.on{background:#2f9e5b}
  .live span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .people{display:flex;align-items:center;gap:10px;position:relative;font-size:13px;color:var(--ink2)}
  .avatars{display:flex;flex-direction:row-reverse}
  .av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:#1a1a1a;
    border:2px solid var(--paper);margin-left:-7px;cursor:default;transition:transform .2s var(--ease)}
  .av:hover{transform:translateY(-2px)}
  .av.more{background:#e4e2dc;color:var(--muted)}
  .av.self{outline:1.5px solid var(--ink);outline-offset:-1.5px}
  .count{white-space:nowrap}
  .plist{position:absolute;top:38px;right:0;min-width:230px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:6px;
    box-shadow:0 18px 40px -12px rgba(30,25,15,.22);opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .16s ease,transform .2s var(--ease);z-index:20}
  .people:hover .plist{opacity:1;pointer-events:auto;transform:none}
  .prow{display:flex;align-items:flex-start;gap:10px;padding:7px 8px;font-size:13.5px;color:var(--ink)}
  .prow .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
  .prow small{display:block;color:var(--muted);font-size:12.5px}

  .me{font-size:13px;color:var(--ink2);white-space:nowrap}
  .me .admin{color:var(--muted);margin-right:6px}
  .linkbtn{font-size:13px;color:var(--muted);white-space:nowrap}
  .linkbtn:hover{color:var(--ink)}

  .btn{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;
    white-space:nowrap;transition:transform .12s ease,background .15s ease}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--ink);color:var(--paper)}
  .btn.primary:hover{background:#000}
  .btn.line{border:1px solid var(--line2);color:var(--ink)}
  .btn.line:hover{border-color:var(--ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

  /* 머리말 */
  .intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;align-items:end;padding:72px 0 36px}
  .intro h1{margin:0;font-size:clamp(40px,6.2vw,84px);line-height:1.02;letter-spacing:-.045em;font-weight:700}
  .intro .side{color:var(--ink2);font-size:14.5px;line-height:1.7;padding-bottom:8px}
  .intro .side .course{color:var(--ink);font-weight:600;margin-bottom:14px;line-height:1.5}
  .intro .side .course span{display:block;font-weight:400;color:var(--muted)}
  .intro .side p{margin:0}

  .bar{display:flex;align-items:baseline;gap:24px;border-top:1px solid var(--ink);padding:12px 0 0}
  .filters{display:flex;gap:4px 18px;flex-wrap:wrap;flex:1}
  .chip{font-size:14px;color:var(--muted);padding:2px 0;border-bottom:1.5px solid transparent;transition:color .15s ease}
  .chip:hover{color:var(--ink)}
  .chip.active{color:var(--ink);border-bottom-color:var(--ink)}
  .chip sup{font-size:10.5px;margin-left:2px;vertical-align:4px}
  .totals{font-size:13px;color:var(--muted);white-space:nowrap}

  /* 작품 목록 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:44px 28px;padding:28px 0 120px}
  .card{cursor:pointer}
  .card.new{animation:arrive .5s var(--ease)}
  @keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .thumb{aspect-ratio:4/3;background:#e2e0da;position:relative;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
  .card:hover .thumb img{transform:scale(1.015)}
  .thumb .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  .thumb .play{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:rgba(21,21,21,.55);display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .18s ease}
  .card:hover .thumb .play{opacity:1}
  @media (hover:none){ .thumb .play{opacity:1} }
  .viewers{position:absolute;left:10px;bottom:10px;display:flex}
  .viewers .av{width:24px;height:24px;font-size:11px;border-color:rgba(255,255,255,.9);margin-left:-6px}
  .viewers .av:first-child{margin-left:0}
  .cap{display:grid;grid-template-columns:30px 1fr auto;gap:0 8px;padding-top:12px}
  .cap .no{font-size:13px;color:var(--muted);padding-top:1px}
  .cap h3{margin:0;font-size:16px;font-weight:600;line-height:1.4;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
  .card:hover .cap h3{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
  .cap .by{grid-column:2;font-size:13.5px;color:var(--ink2);margin-top:2px}
  .cap .by i{font-style:normal;color:var(--muted)}
  .cap .tl{grid-column:2;font-size:13px;color:var(--muted);margin-top:2px}
  .del{font-size:12.5px;color:var(--muted);height:22px;transition:color .15s ease}
  .del:hover{color:var(--danger)}
  .del.armed{color:var(--danger);font-weight:600}
  .empty{grid-column:1/-1;color:var(--muted);padding:80px 0;font-size:15px}

  /* 시트(모달) */
  .overlay{position:fixed;inset:0;background:rgba(28,26,22,.42);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;
    opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s linear .2s}
  .overlay.show{opacity:1;visibility:visible;transition:opacity .2s ease}
  .modal{background:var(--sheet);border-radius:14px;width:100%;max-width:520px;max-height:92vh;overflow:auto;
    box-shadow:0 30px 80px -20px rgba(20,15,5,.35);transform:translateY(12px) scale(.985);transition:transform .32s var(--ease)}
  .overlay.show .modal{transform:none}
  .modal.wide{max-width:1180px;overflow:hidden}
  .modal-head{display:flex;align-items:center;padding:22px 24px 6px}
  .modal-head h2{margin:0;font-size:20px;letter-spacing:-.02em}
  .x{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:18px;line-height:1}
  .x:hover{background:#ebe9e3;color:var(--ink)}
  .modal-body{padding:12px 24px 24px}
  .modal-body .lead{margin:0 0 4px;color:var(--muted);font-size:14px}
  label{display:block;font-size:13.5px;font-weight:600;margin:18px 0 6px}
  label small{font-weight:400;color:var(--muted);margin-left:6px}
  input[type=text],textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none;transition:border-color .15s ease}
  input[type=text]:focus,textarea:focus{border-color:var(--ink)}
  ::placeholder{color:#a9a69e}
  textarea{resize:vertical;min-height:88px;line-height:1.55}
  .drop{border:1px dashed var(--line2);border-radius:8px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:#fff;font-size:14px;transition:border-color .15s ease}
  .drop:hover{border-color:var(--ink2)}
  .drop.has{border-style:solid;border-color:var(--ink);color:var(--ink)}
  .drop video{max-width:100%;max-height:200px;margin-top:10px;display:block;margin-inline:auto}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  .err{color:var(--danger);font-size:13px;margin-top:12px;min-height:1em}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

  .detail{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);height:min(720px,88vh)}
  .detail .left{background:#111;display:flex;align-items:center;justify-content:center;min-height:0}
  .detail .left video{width:100%;max-height:100%;display:block}
  .detail .right{display:flex;flex-direction:column;min-height:0;position:relative}
  .detail .right .x{position:absolute;right:12px;top:12px}
  .detail .info{padding:26px 28px 18px;overflow:auto;flex:0 1 auto;max-height:58%}
  .detail .info .no{font-size:13px;color:var(--muted)}
  .detail .info h2{margin:2px 36px 6px 0;font-size:24px;line-height:1.3;letter-spacing:-.025em;word-break:keep-all}
  .detail .info .by{display:flex;gap:12px;align-items:baseline;font-size:14px;color:var(--ink2)}
  .detail .info .by i{font-style:normal;color:var(--muted)}
  .sec{margin-top:20px}
  .sec h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink)}
  .sec .text{white-space:pre-wrap;font-size:14.5px;line-height:1.7;color:var(--ink2)}
  .sec pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.7;
    background:var(--paper);border-radius:6px;padding:12px 14px;color:var(--ink2)}
  .chead{display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:600;padding:14px 28px 4px;border-top:1px solid var(--line)}
  .chead span{font-weight:400;color:var(--muted)}
  .comments{flex:1;overflow:auto;padding:0 28px 12px;min-height:120px}
  .cmt{padding:11px 0;border-bottom:1px solid #ebe9e3}
  .cmt:last-child{border-bottom:0}
  .cmt .who{font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:baseline}
  .cmt .who small{font-weight:400;color:var(--muted);font-size:12.5px}
  .cmt .who .del{margin-left:auto;height:auto}
  .cmt .body{font-size:14.5px;margin-top:2px;white-space:pre-wrap;word-break:break-word;line-height:1.6;color:var(--ink2)}
  .cform{display:flex;gap:8px;padding:12px 16px 16px 28px;border-top:1px solid var(--line)}
  .cform input{flex:1;border-radius:999px;padding:9px 16px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;
    opacity:0;transition:opacity .2s ease,transform .3s var(--ease);z-index:100;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .progress{height:3px;background:var(--line);overflow:hidden;margin-top:14px;display:none;border-radius:2px}
  .progress div{height:100%;width:0;background:var(--ink);transition:width .2s linear}

  .pagedrop{position:fixed;inset:0;z-index:80;background:rgba(243,242,238,.9);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s ease}
  .pagedrop::before{content:"";position:absolute;inset:16px;border:1.5px dashed var(--ink);border-radius:16px}
  .pagedrop.show{opacity:1}
  .pagedrop div{text-align:center;transform:translateY(6px);transition:transform .3s var(--ease)}
  .pagedrop.show div{transform:none}
  .pagedrop b{display:block;font-size:30px;letter-spacing:-.03em}
  .pagedrop span{color:var(--muted)}

  /* 실시간 커서 */
  #cursors{position:absolute;left:0;top:0;width:0;height:0;z-index:90;pointer-events:none}
  .cursor{position:absolute;left:0;top:0;transition:transform .22s linear,opacity .3s ease;will-change:transform}
  .cursor svg{display:block}
  .cursor .tag{position:absolute;left:14px;top:17px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;color:#1a1a1a;white-space:nowrap}
  .cursor.idle{opacity:0}

  @media (max-width:900px){
    .intro{grid-template-columns:1fr;gap:24px;padding:44px 0 28px}
    .detail{grid-template-columns:1fr;height:auto;max-height:90vh;overflow:auto}
    .detail .left video{max-height:50vh}
    .detail .info{max-height:none}
    .modal.wide{overflow:auto}
  }
  @media (max-width:640px){
    .wrap{padding:0 16px}
    header .wrap{gap:12px}
    .brand span,.me,.linkbtn,.count{display:none}
    .bar{flex-direction:column;gap:8px}
    .grid{gap:32px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation:none !important}
  }
</style>
</head>
<body>
<header id="top">
  <div class="wrap">
    <div class="brand">산업디자인 × AI<span>제품 영상 크리틱</span></div>
    <div class="spacer"></div>
    <div class="people" id="people"><span class="live" id="live"><span>연결 중</span></span><div class="avatars" id="avatars"></div><span class="count" id="pcount"></span><div class="plist" id="plist"></div></div>
    <div class="me" id="me"></div>
    <button class="linkbtn" id="renameBtn">이름 바꾸기</button>
    <button class="btn primary" id="uploadBtn">작품 올리기</button>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <h1>AI 제품 영상<br>크리틱</h1>
    <div class="side">
      <div class="course">경희대학교 산업디자인학과<span>AI 디자인 수업 · 2026. 11. 26.</span></div>
      <p>오늘 만든 제품 영상을 올리고, 어떤 도구와 프롬프트로 만들었는지 같이 적어 주세요. 다른 사람 작품에는 크리틱을 남겨 주세요. 영상 파일은 화면에 바로 끌어다 놓아도 됩니다.</p>
    </div>
  </section>
  <div class="bar"><div class="filters" id="filters"></div><div class="totals" id="totals"></div></div>
  <section class="grid" id="grid"><div class="empty">불러오는 중…</div></section>
</main>

<!-- 이름 -->
<div class="overlay" id="nickModal">
  <div class="modal">
    <div class="modal-head"><h2>이름을 알려 주세요</h2></div>
    <div class="modal-body">
      <p class="lead">작품과 크리틱 옆에 이 이름이 붙습니다.</p>
      <label for="nickInput">이름</label>
      <input type="text" id="nickInput" maxlength="20" placeholder="김경희">
      <div class="err" id="nickErr"></div>
      <div class="actions"><button class="btn primary" id="nickSave">들어가기</button></div>
    </div>
  </div>
</div>

<!-- 업로드 -->
<div class="overlay" id="upModal">
  <div class="modal">
    <div class="modal-head"><h2>작품 올리기</h2><div class="spacer"></div><button class="x" data-close aria-label="닫기">✕</button></div>
    <div class="modal-body">
      <label>영상<small>50MB까지</small></label>
      <div class="drop" id="drop">눌러서 고르거나 여기로 끌어다 놓으세요<input type="file" id="file" accept="video/*" hidden></div>
      <label for="fTitle">제목</label>
      <input type="text" id="fTitle" maxlength="60" placeholder="FOLD 접이식 캠핑 랜턴">
      <label for="fTools">사용한 도구<small>쉼표로 나눠 주세요</small></label>
      <input type="text" id="fTools" maxlength="120" placeholder="Midjourney, Runway">
      <label for="fPrompt">프롬프트</label>
      <textarea id="fPrompt" placeholder="입력했던 프롬프트를 그대로 붙여 넣어 주세요"></textarea>
      <label for="fHow">만든 과정</label>
      <textarea id="fHow" placeholder="스케치로 형태를 정하고, 이미지 AI로 색과 소재를 바꿔 본 뒤 영상으로 만들었어요"></textarea>
      <div class="progress" id="prog"><div></div></div>
      <div class="err" id="upErr"></div>
      <div class="actions"><button class="btn line" data-close>취소</button><button class="btn primary" id="upSubmit">올리기</button></div>
    </div>
  </div>
</div>

<!-- 상세 -->
<div class="overlay" id="detailModal">
  <div class="modal wide">
    <div class="detail">
      <div class="left"><video id="dVideo" controls playsinline loop></video></div>
      <div class="right">
        <button class="x" id="dClose" aria-label="닫기">✕</button>
        <div class="info" id="dInfo"></div>
        <div class="chead">크리틱<span id="dCount"></span></div>
        <div class="comments" id="dComments"></div>
        <form class="cform" id="cForm">
          <input type="text" id="cInput" maxlength="300" placeholder="형태, 소재, 연출에 대해 한마디" autocomplete="off">
          <button class="btn primary" type="submit">남기기</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="pagedrop" id="pagedrop"><div><b>여기에 놓으세요</b><span>영상 파일, 50MB까지</span></div></div>

<div id="cursors"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js"></script>
<script>
const SUPABASE_URL = "https://xzejhtggfrwaazvmkokw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6ZWpodGdnZnJ3YWF6dm1rb2t3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2Nzc1NjYsImV4cCI6MjExMTI1MzU2Nn0.ipct6SMF-Wcph9nknjaFoot5CkVgQxJewGW7zIIsRDo";
const MAX_BYTES = 50 * 1024 * 1024;        // 저장소에 올라가는 파일 한 개 한도
const MAX_INPUT = 400 * 1024 * 1024;       // 압축 전 원본으로 받아 줄 최대 크기

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }
let me = { id: store("cvs_id"), nick: store("cvs_nick") };
if(!me.id){ me.id = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)); store("cvs_id", me.id); }

/* 교수자 모드: 주소 끝에 ?teacher=khu2026 을 붙여 한 번 열면 이 브라우저에서 모든 작품·크리틱을 지울 수 있음 (?teacher=off 로 해제) */
(()=>{ const q = new URLSearchParams(location.search).get("teacher");
  if(q==="khu2026") store("cvs_teacher","1"); else if(q==="off") store("cvs_teacher","0");
  if(q!==null) history.replaceState(null,"",location.pathname); })();

// 두 번 눌러 확인하는 버튼: 첫 클릭에 '삭제?'로 바뀌고 3초 안에 다시 누르면 실행
function armOrRun(btn, armedLabel, run){
  if(!btn.classList.contains("armed")){
    btn.classList.add("armed"); btn._orig = btn.innerHTML; btn.innerHTML = armedLabel;
    clearTimeout(btn._t); btn._t = setTimeout(()=>{ btn.classList.remove("armed"); btn.innerHTML = btn._orig; }, 3000);
    return;
  }
  clearTimeout(btn._t); btn.disabled = true; run();
}
async function deletePost(p){
  const { error } = await sb.from("posts").delete().eq("id", p.id);
  if(error) return toast("삭제 실패: "+error.message);
  await sb.storage.from("videos").remove([p.video_path, ...(p.thumb_url ? [p.video_path.replace(/\.[^.]+$/, "") + ".jpg"] : [])]);
  posts = posts.filter(x=>x.id!==p.id); render();
  if(openPost?.id===p.id) closeDetail();
  toast("삭제했습니다");
}

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function ago(ts){
  const s = (Date.now()-new Date(ts))/1000;
  if(s<60) return "방금"; if(s<3600) return Math.floor(s/60)+"분 전";
  if(s<86400) return Math.floor(s/3600)+"시간 전"; return new Date(ts).toLocaleDateString("ko-KR");
}

  const f = $("#filters");
  f.innerHTML = `<button class="chip ${!filterNick?"active":""}" data-n="">전체<sup>${posts.length}</sup></button>` +
    names.map(n=>`<button class="chip ${filterNick===n?"active":""}" data-n="${esc(n)}">${esc(n)}<sup>${posts.filter(p=>p.nickname===n).length}</sup></button>`).join("");
  f.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ filterNick = c.dataset.n || null; render(); });
}
const workNo = p => String(posts.length - posts.indexOf(p)).padStart(2,"0");
function paintStats(){
  const crits = posts.reduce((n,p)=>n+(counts[p.id]||0),0);
  $("#totals").textContent = posts.length ? `작품 ${posts.length} · 크리틱 ${crits}` : "";
}
const critLabel = n => n ? `크리틱 ${n}` : "";
function cardHTML(p){

  const n = counts[p.id]||0;
  return `<article class="card" data-id="${p.id}">
    <div class="thumb">${p.thumb_url?`<img src="${esc(p.thumb_url)}" alt="" loading="lazy" decoding="async">`:`<div class="noimg">눌러서 영상 보기</div>`}
      <span class="play"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z" fill="#fff"/></svg></span>
      <div class="viewers" data-v="${p.id}"></div></div>
    <div class="cap">
      <span class="no">${workNo(p)}</span>
      <h3>${esc(p.title)}</h3>
      ${canDelete(p)?`<button class="del">삭제</button>`:"<span></span>"}
      <div class="by">${esc(p.nickname)} <i>· <span class="ago" data-ts="${p.created_at}">${ago(p.created_at)}</span><span class="badge">${n?` · ${critLabel(n)}`:""}</span></i></div>
      ${tools.length?`<div class="tl">${tools.map(esc).join(", ")}</div>`:""}

function render(newId){
  renderFilters(); paintStats();
  const list = filterNick ? posts.filter(p=>p.nickname===filterNick) : posts;
  const g = $("#grid");
  if(!list.length){ g.innerHTML = filterNick ? `<div class="empty">이 사람이 올린 작품이 없습니다.</div>` : `<div class="empty">아직 올라온 작품이 없습니다.</div>`; return; }
  g.innerHTML = list.map(cardHTML).join("");
  g.querySelectorAll(".card").forEach(c=>{
    if(c.dataset.id===newId) c.classList.add("new");
    c.onclick = ()=>openDetail(c.dataset.id);
    const d = c.querySelector(".del");
    if(d) d.onclick = e=>{ e.stopPropagation(); const p = posts.find(x=>x.id===c.dataset.id); if(p) armOrRun(d, "정말 삭제", ()=>deletePost(p)); };
  });
  paintViewers();
}
async function load(){
  const { data, error } = await sb.from("posts").select("*").order("created_at",{ascending:false});
  if(error){ $("#grid").innerHTML = `<div class="empty">불러오지 못했어요: ${esc(error.message)}</div>`; return; }
  posts = data;
  const { data: cs } = await sb.from("comments").select("post_id");
  counts = {}; (cs||[]).forEach(c=>counts[c.post_id]=(counts[c.post_id]||0)+1);
  render();
}

/* 화면 어디에나 끌어다 놓기 */
let dragDepth = 0, pendingFile = null;
const pageDrop = $("#pagedrop");
const hasFiles = e => [...(e.dataTransfer?.types||[])].includes("Files");
function hidePageDrop(){ dragDepth = 0; pageDrop.classList.remove("show"); }
window.addEventListener("dragenter", e=>{
  if(!hasFiles(e)) return; e.preventDefault();
  dragDepth++;
  if(!$("#upModal").classList.contains("show")) pageDrop.classList.add("show");
});
window.addEventListener("dragover", e=>{ if(hasFiles(e)) e.preventDefault(); });
window.addEventListener("dragleave", e=>{ if(!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth-1); if(!dragDepth) hidePageDrop(); });
window.addEventListener("drop", e=>{
  if(!hasFiles(e)) return; e.preventDefault(); hidePageDrop();
  const f = e.dataTransfer.files[0]; if(!f) return;
  if(!f.type.startsWith("video/")) return toast("영상 파일만 올릴 수 있어요");
  if($("#detailModal").classList.contains("show")) closeDetail();
  if(!me.nick){ pendingFile = f; return askNick(); }
  openUploadWith(f);
});
function openUploadWith(f){ show("#upModal"); pick(f); setTimeout(()=>$("#fTitle").focus(),50); }
fileIn.onchange = ()=>pick(fileIn.files[0]);
function pick(f){
  $("#upErr").textContent = "";
  if(!f) return;
  if(!f.type.startsWith("video/")){ $("#upErr").textContent="영상 파일만 올릴 수 있어요"; return; }
  const limit = canCompress ? MAX_INPUT : MAX_BYTES;
  if(f.size > limit){ $("#upErr").textContent=`${mb(f.size)}라서 올릴 수 없어요. ${canCompress ? "더 짧게 잘라서" : "1080p로 다시 내보내서 50MB 아래로 줄인 뒤"}올려 주세요.`; return; }
  if(compressJob) compressJob.cancel();
  pickedFile = f;
  thumbJob = makeThumb(f);
  drop.classList.add("has");
  drop.innerHTML = `<b>${esc(f.name)}</b> · ${mb(f.size)}<br><video src="${URL.createObjectURL(f)}" muted autoplay loop playsinline></video><div class="hint" id="cmpState">다른 파일로 바꾸려면 한 번 더 누르세요</div>`;
  drop.appendChild(fileIn);
  // 고르자마자 뒤에서 압축을 시작해 두고, 올리기 버튼을 누르면 결과를 기다린다
  let cancelled = false;
  const state = t=>{ const el = document.getElementById("cmpState"); if(el && pickedFile===f) el.textContent = t; };
  const promise = canCompress
    ? (state("용량 줄이는 중… 0%"),
       compressVideo(f, r=>state(`용량 줄이는 중… ${Math.round(r*100)}%`), ()=>cancelled)
        .then(r=>{ state(r.to ? `${mb(r.from)} → ${mb(r.to)}로 줄였어요` : `원본 그대로 올립니다 (${mb(f.size)})`); return r; })
        .catch(()=>({ file: f, reason: "cancelled" })))
    : Promise.resolve({ file: f, reason: "unsupported" });
  compressJob = { promise, cancel: ()=>{ cancelled = true; } };
  if(!$("#fTitle").value) $("#fTitle").value = f.name.replace(/\.[^.]+$/,"");
}
function resetUpload(){
  if(compressJob) compressJob.cancel();
  pickedFile=null; thumbJob=null; compressJob=null; fileIn.value=""; drop.classList.remove("has");
  drop.innerHTML="눌러서 고르거나 여기로 끌어다 놓으세요"; drop.appendChild(fileIn);
  ["#fTitle","#fTools","#fPrompt","#fHow"].forEach(s=>$(s).value="");
  $("#upErr").textContent=""; $("#prog").style.display="none"; $("#prog div").style.width="0";
}

// 고른 영상(내 컴퓨터 파일)에서 한 장면을 잘라 작은 jpg로 만든다. 네트워크는 쓰지 않음
function makeThumb(file){
  return new Promise(res=>{
    const v = document.createElement("video"), url = URL.createObjectURL(file);
    let done = false;
    const finish = b=>{ if(done) return; done = true; URL.revokeObjectURL(url); v.removeAttribute("src"); v.load(); res(b); };
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    v.onloadeddata = ()=>{ v.currentTime = Math.min(1, (v.duration||2) * 0.2); };
    v.onseeked = ()=>{
      const W = 720, vw = v.videoWidth || 1280, vh = v.videoHeight || 720;
      const w = Math.min(W, vw), h = Math.round(w * vh / vw);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      try{ c.getContext("2d").drawImage(v, 0, 0, w, h); c.toBlob(b=>finish(b), "image/jpeg", 0.72); }catch(e){ finish(null); }
    };
    v.onerror = ()=>finish(null);
    setTimeout(()=>finish(null), 8000);
  });
}
let thumbJob = null, compressJob = null;

/* ── 업로드 전 압축 ──────────────────────────────────────────
   학생 컴퓨터에서 영상을 긴 변 1280px(720p), 약 2Mbps H.264로 다시 인코딩한다.
   영상은 숨긴 <video>로 재생하며 프레임을 받아 VideoEncoder로, 소리는 AudioEncoder(AAC)로.
   지원하지 않는 브라우저이거나 중간에 문제가 생기면 원본을 그대로 쓴다. */
const canCompress = typeof VideoEncoder !== "undefined" && typeof VideoFrame !== "undefined"
  && "requestVideoFrameCallback" in HTMLVideoElement.prototype && typeof Mp4Muxer !== "undefined";
const LONG_SIDE = 1280, V_BITRATE = 2_000_000, A_BITRATE = 128_000;

async function pickVideoCodec(width, height){
  for(const codec of ["avc1.4d0028","avc1.42e028","avc1.42001f"]){
    const cfg = { codec, width, height, bitrate: V_BITRATE, framerate: 30, avc: { format: "avc" } };
    try{ if((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg; }catch(e){}
  }
  return null;
}
async function decodeAudio(file){
  try{
    const buf = await file.arrayBuffer();
    const ctx = new OfflineAudioContext(2, 1, 48000);
    const ab = await ctx.decodeAudioData(buf);
    return ab.length ? ab : null;            // 소리가 없는 파일이면 여기서 실패 → null
  }catch(e){ return null; }
}
async function compressVideo(file, onProgress, isCancelled){
  if(!canCompress) return { file, reason: "unsupported" };
  const url = URL.createObjectURL(file);
  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
  v.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
  document.body.appendChild(v);      // 문서에 붙어 있어야 프레임 콜백이 확실히 온다
  let watchdog = null;
  const cleanup = ()=>{ clearInterval(watchdog); v.pause(); v.removeAttribute("src"); v.load(); v.remove(); URL.revokeObjectURL(url); };
  try{
    await new Promise((res, rej)=>{ v.onloadedmetadata = res; v.onerror = ()=>rej(new Error("영상을 읽지 못했어요")); });
    const vw = v.videoWidth, vh = v.videoHeight, dur = v.duration;
    if(!vw || !vh || !isFinite(dur)) return { file, reason: "meta" };
    const k = Math.min(1, LONG_SIDE / Math.max(vw, vh));
    const width = Math.round(vw * k / 2) * 2, height = Math.round(vh * k / 2) * 2;

    const vcfg = await pickVideoCodec(width, height);
    if(!vcfg) return { file, reason: "codec" };

    const audio = await decodeAudio(file);
    let acfg = null;
    if(audio){
      const ch = Math.min(2, audio.numberOfChannels);
      acfg = { codec: "mp4a.40.2", sampleRate: audio.sampleRate, numberOfChannels: ch, bitrate: A_BITRATE };
      try{ if(!(await AudioEncoder.isConfigSupported(acfg)).supported) acfg = null; }catch(e){ acfg = null; }
      if(!acfg) return { file, reason: "audio" };     // 소리가 있는데 못 넣으면 원본 유지
    }

    const target = new Mp4Muxer.ArrayBufferTarget();
    const muxer = new Mp4Muxer.Muxer({
      target, fastStart: "in-memory", firstTimestampBehavior: "offset",
      video: { codec: "avc", width, height },
      ...(acfg ? { audio: { codec: "aac", numberOfChannels: acfg.numberOfChannels, sampleRate: acfg.sampleRate } } : {})
    });
    let failed = null;
    const venc = new VideoEncoder({ output: (c, m)=>{ try{ muxer.addVideoChunk(c, m); }catch(e){ failed = e; } }, error: e=>{ failed = e; } });
    venc.configure(vcfg);

    if(acfg){
      const aenc = new AudioEncoder({ output: (c, m)=>{ try{ muxer.addAudioChunk(c, m); }catch(e){ failed = e; } }, error: e=>{ failed = e; } });
      aenc.configure(acfg);
      const ch = acfg.numberOfChannels, sr = audio.sampleRate, N = audio.length, STEP = 4096;
      for(let i = 0; i < N; i += STEP){
        const n = Math.min(STEP, N - i), data = new Float32Array(n * ch);
        for(let c = 0; c < ch; c++) data.set(audio.getChannelData(c).subarray(i, i + n), c * n);
        const ad = new AudioData({ format: "f32-planar", sampleRate: sr, numberOfFrames: n, numberOfChannels: ch, timestamp: Math.round(i / sr * 1e6), data });
        aenc.encode(ad); ad.close();
      }
      await aenc.flush(); aenc.close();
    }

    const canvas = document.createElement("canvas"); canvas.width = width; canvas.height = height;
    const g = canvas.getContext("2d");
    let lastTs = -1, lastKey = -Infinity;
    v.playbackRate = dur > 12 ? 2 : 1;      // 긴 영상만 빨리 감아 시간 절약
    await new Promise((res, rej)=>{
      let lastBeat = Date.now();
      watchdog = setInterval(()=>{ if(Date.now() - lastBeat > 10000) rej(new Error("stalled")); }, 1000);   // 10초간 진행이 없으면 원본으로
      const onFrame = (now, meta)=>{
        lastBeat = Date.now();
        if(isCancelled() || failed){ return rej(failed || new Error("cancelled")); }
        const ts = Math.round(meta.mediaTime * 1e6);
        if(ts > lastTs){
          g.drawImage(v, 0, 0, width, height);
          const frame = new VideoFrame(canvas, { timestamp: ts, duration: 33333 });   // 길이 값이 없으면 mp4로 못 묶음 (실제 간격은 muxer가 다음 프레임으로 보정)
          const key = ts - lastKey >= 2e6;            // 2초마다 키프레임
          if(key) lastKey = ts;
          venc.encode(frame, { keyFrame: key }); frame.close();
          lastTs = ts;
          onProgress(Math.min(.99, meta.mediaTime / dur));
        }
        if(!v.ended) v.requestVideoFrameCallback(onFrame);
      };
      v.requestVideoFrameCallback(onFrame);
      v.onended = res;
      v.onerror = ()=>rej(new Error("재생 오류"));
      v.play().catch(rej);
    });
    await venc.flush(); venc.close();
    if(failed) throw failed;
    if(lastTs < 0) return { file, reason: "noframes" };
    muxer.finalize();
    const out = new File([target.buffer], file.name.replace(/\.[^.]+$/, "") + ".mp4", { type: "video/mp4" });
    onProgress(1);
    if(out.size >= file.size * 0.9) return { file, reason: "notsmaller" };   // 이미 작은 영상은 원본 유지
    return { file: out, from: file.size, to: out.size };
  }catch(e){
    if(isCancelled()) throw e;
    console.warn("[compress]", e);
    return { file, reason: "error" };
  }finally{ cleanup(); }
}
const mb = n => (n/1048576).toFixed(1) + "MB";
function uploadWithProgress(path, file, onProgress){
  // supabase-js 업로드는 진행률이 없어 XHR로 직접 올림
  return new Promise((resolve,reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `${SUPABASE_URL}/storage/v1/object/videos/${path}`);
    xhr.setRequestHeader("Authorization", `Bearer ${SUPABASE_ANON_KEY}`);
    xhr.setRequestHeader("apikey", SUPABASE_ANON_KEY);
    xhr.setRequestHeader("Content-Type", file.type || "video/mp4");
    xhr.setRequestHeader("x-upsert", "false");
    xhr.setRequestHeader("cache-control", "max-age=604800");   // 브라우저가 일주일 동안 다시 받지 않게
    xhr.upload.onprogress = e=>{ if(e.lengthComputable) onProgress(e.loaded/e.total); };
    xhr.onload = ()=> xhr.status<300 ? resolve() : reject(new Error((()=>{ try{return JSON.parse(xhr.responseText).message}catch(e){return xhr.statusText} })()));
    xhr.onerror = ()=>reject(new Error("네트워크 오류"));
    xhr.send(file);
  });
}
$("#upSubmit").onclick = async ()=>{
  const title = $("#fTitle").value.trim();
  if(!pickedFile){ $("#upErr").textContent="영상을 골라 주세요"; return; }
  if(!title){ $("#upErr").textContent="제목을 입력해 주세요"; return; }
  const btn = $("#upSubmit"); btn.disabled = true;
  $("#upErr").textContent=""; $("#prog").style.display="block";
  try{
    btn.textContent = "용량 줄이는 중…";
    const job = compressJob;
    const result = job ? await job.promise : { file: pickedFile };
    const upFile = result.file;
    if(upFile.size > MAX_BYTES) throw new Error(`${mb(upFile.size)}라서 50MB 한도를 넘어요. 영상을 더 짧게 잘라 주세요.`);
    btn.textContent = "올리는 중…";
    const ext = (upFile.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"") || "mp4";
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    await uploadWithProgress(path, upFile, r=>$("#prog div").style.width=(r*95).toFixed(0)+"%");
    const { data:{ publicUrl } } = sb.storage.from("videos").getPublicUrl(path);
    let thumb_url = null;
    const thumb = thumbJob ? await thumbJob : null;
    if(thumb){
      const tpath = path.replace(/\.[^.]+$/, "") + ".jpg";
      try{ await uploadWithProgress(tpath, thumb, ()=>{}); thumb_url = sb.storage.from("videos").getPublicUrl(tpath).data.publicUrl; }catch(e){}
    }
    $("#prog div").style.width = "100%";
    const { error } = await sb.from("posts").insert({
      author_id: me.id, nickname: me.nick, title,
      tools: $("#fTools").value.trim(), prompt: $("#fPrompt").value.trim(), how_made: $("#fHow").value.trim(),
      video_path: path, video_url: publicUrl, thumb_url
    });
    if(error) throw error;
    hide("#upModal"); resetUpload(); toast("올렸습니다");
  }catch(e){
    $("#upErr").textContent = "업로드 실패: " + e.message;
  }finally{ btn.disabled=false; btn.textContent="올리기"; }
};

async function openDetail(id){
  const p = posts.find(x=>x.id===id); if(!p) return;
  openPost = p;
  $("#dVideo").poster = p.thumb_url || "";
  $("#dVideo").src = p.video_url;
  $("#dVideo").play().catch(()=>{});
  const tools = (p.tools||"").split(",").map(s=>s.trim()).filter(Boolean);
  $("#dInfo").innerHTML = `
    <div class="no">${workNo(p)}</div>
    <h2>${esc(p.title)}</h2>
    <div class="by"><span>${esc(p.nickname)} <i>· ${ago(p.created_at)}</i></span>
      ${canDelete(p)?`<button class="del" id="delPost" style="margin-left:auto">삭제</button>`:""}</div>
    ${tools.length?`<div class="sec"><h4>사용한 도구</h4><div class="text">${tools.map(esc).join(", ")}</div></div>`:""}
    ${p.prompt?`<div class="sec"><h4>프롬프트</h4><pre>${esc(p.prompt)}</pre></div>`:""}
    ${p.how_made?`<div class="sec"><h4>만든 과정</h4><div class="text">${esc(p.how_made)}</div></div>`:""}
    ${!tools.length && !p.prompt && !p.how_made ? `<div class="sec"><div class="text" style="color:var(--muted)">만든 과정은 적혀 있지 않습니다.</div></div>`:""}`;
  const del = $("#delPost");
  if(del) del.onclick = ()=>armOrRun(del, "한 번 더 누르면 삭제", ()=>deletePost(p));
  $("#dCount").textContent = "";
  $("#dComments").innerHTML = `<div class="hint">불러오는 중…</div>`;
  show("#detailModal");
  trackMe();
  const { data } = await sb.from("comments").select("*").eq("post_id", id).order("created_at");
  if(openPost?.id!==id) return;
  renderComments(data||[]);
}
let curComments = [];
function renderComments(list){
  curComments = list;
  const box = $("#dComments");
  $("#dCount").textContent = list.length || "";
  if(!list.length){ box.innerHTML = `<div class="hint" style="padding-top:8px">아직 없습니다.</div>`; return; }
  box.innerHTML = list.map(c=>`<div class="cmt">
      <div class="who">${esc(c.nickname)}<small>${ago(c.created_at)}</small>${canDelete(c)?`<button class="del" data-id="${c.id}">삭제</button>`:""}</div>
      <div class="body">${esc(c.body)}</div></div>`).join("");
  box.querySelectorAll(".del").forEach(b=>b.onclick=()=>sb.from("comments").delete().eq("id",b.dataset.id));
  box.scrollTop = box.scrollHeight;
}
function closeDetail(){ hide("#detailModal"); $("#dVideo").pause(); $("#dVideo").removeAttribute("src"); openPost=null; trackMe(); }
$("#cForm").onsubmit = async e=>{
  e.preventDefault();
  if(!me.nick) return askNick();
  const body = $("#cInput").value.trim(); if(!body || !openPost) return;
  $("#cInput").value = "";
  const { error } = await sb.from("comments").insert({ post_id: openPost.id, author_id: me.id, nickname: me.nick, body });
  if(error){ toast("남기지 못했어요: "+error.message); $("#cInput").value = body; }
};

/* 실시간 */
sb.channel("class-room")
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"posts"},({new:p})=>{
    if(posts.some(x=>x.id===p.id)) return;
    posts.unshift(p); render(p.id);
    if(p.author_id!==me.id) toast(`${p.nickname} 님이 작품을 올렸습니다`);
  })
  .on("postgres_changes",{event:"DELETE",schema:"public",table:"posts"},({old})=>{
    posts = posts.filter(x=>x.id!==old.id); render();
    if(openPost?.id===old.id) closeDetail();
  })
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"comments"},({new:c})=>{
    counts[c.post_id]=(counts[c.post_id]||0)+1; updateBadge(c.post_id);
    if(openPost?.id===c.post_id && !curComments.some(x=>x.id===c.id)) renderComments([...curComments, c]);
  })
  .on("postgres_changes",{event:"DELETE",schema:"public",table:"comments"},({old})=>{
    if(old.post_id){ counts[old.post_id]=Math.max(0,(counts[old.post_id]||1)-1); updateBadge(old.post_id); }
    if(curComments.some(x=>x.id===old.id)) renderComments(curComments.filter(x=>x.id!==old.id));
  })
  .subscribe(status=>{
    const on = status==="SUBSCRIBED";
    $("#live").classList.toggle("on", on);
    $("#live span").textContent = on ? "실시간 연결됨" : "연결 중"; $("#live").title = on ? "실시간 연결됨" : "연결 중";
  });
function updateBadge(pid){ const b=document.querySelector(`.card[data-id="${pid}"] .badge`); if(b) b.textContent = counts[pid] ? ` · ${critLabel(counts[pid])}` : ""; paintStats(); }
setInterval(()=>document.querySelectorAll(".ago").forEach(el=>el.textContent = ago(el.dataset.ts)), 60000);

/* 접속자 + 실시간 커서 (Supabase Realtime Presence / Broadcast) */
const PALETTE = ["#f2a48f","#f0c27b","#e6d96b","#a9cf8a","#86cfc4","#8fb8e8","#b2a7e6","#e1a6cf","#d9b99b","#9fd0e6"];
function colorOf(id){ let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }
me.color = colorOf(me.id);
const initial = n => [...(n||"?").trim()][0] || "?";
let people = [];                       // [{id,nick,color,viewing,viewingTitle,at}]
let roomReady = false;

const room = sb.channel("class-room-presence", { config: { presence: { key: me.id }, broadcast: { self: false } } });
function trackMe(){
  if(!roomReady || !me.nick) return;
  room.track({ id: me.id, nick: me.nick, color: me.color,
    viewing: openPost?.id || null, viewingTitle: openPost?.title || null, at: Date.now() });
}
function readPeople(){
  const st = room.presenceState(), out = [];
  for(const key in st){ const m = st[key][st[key].length-1]; if(m && m.nick) out.push(m); }
  out.sort((a,b)=> (a.id===me.id?-1:b.id===me.id?1:a.at-b.at));
  return out;
}
function paintPeople(){
  const MAX = 6, shown = people.slice(0, MAX);
  $("#avatars").innerHTML =
    (people.length>MAX ? `<div class="av more">+${people.length-MAX}</div>` : "") +
    shown.slice().reverse().map(p=>`<div class="av ${p.id===me.id?"self":""}" style="background:${p.color}" title="${esc(p.nick)}">${esc(initial(p.nick))}</div>`).join("");
  $("#pcount").textContent = people.length ? `${people.length}명 보는 중` : "";
  $("#plist").innerHTML = people.map(p=>`<div class="prow"><span class="dot" style="background:${p.color}"></span>
      <div><b>${esc(p.nick)}</b>${p.id===me.id?" (나)":""}<small>${p.viewing?`‘${esc(p.viewingTitle||"")}’ 보는 중`:"목록 보는 중"}</small></div></div>`).join("");
  paintViewers();
}
function paintViewers(){
  document.querySelectorAll(".viewers").forEach(box=>{
    const vs = people.filter(p=>p.viewing===box.dataset.v);
    box.innerHTML = vs.slice(0,4).map(p=>`<div class="av" style="background:${p.color}" title="${esc(p.nick)} 보는 중">${esc(initial(p.nick))}</div>`).join("");
  });
}

// 커서: 가운데 정렬된 본문(.wrap) 기준 좌표로 주고받아 화면 폭이 달라도 같은 자리에 보이게
const cursorLayer = $("#cursors"), cursors = {};
const wrapLeft = () => document.querySelector("main.wrap").getBoundingClientRect().left + window.scrollX;
function moveCursor(d){
  const p = people.find(x=>x.id===d.id) || d;
  let c = cursors[d.id];
  if(!c){
    c = document.createElement("div"); c.className = "cursor";
    c.innerHTML = `<svg width="18" height="22" viewBox="0 0 18 22"><path d="M1 1l15 9.5-6.6 1.6L6.2 20z" fill="${p.color}" stroke="#151515" stroke-width="1.3" stroke-linejoin="round"/></svg><div class="tag" style="background:${p.color}"></div>`;
    c.style.transform = `translate(${wrapLeft()+d.x}px,${d.y}px)`;
    cursorLayer.appendChild(c); cursors[d.id] = { el:c };
    c = cursors[d.id];
  }
  c.el.querySelector(".tag").textContent = p.nick || d.nick || "";
  c.el.classList.remove("idle");
  c.el.style.transform = `translate(${wrapLeft()+d.x}px,${d.y}px)`;
  clearTimeout(c.t); c.t = setTimeout(()=>c.el.classList.add("idle"), 5000);
}
function dropCursor(id){ const c=cursors[id]; if(c){ c.el.remove(); delete cursors[id]; } }

let lastSend = 0, pendingMove = null, sendTimer = null;
function sendMove(){
  sendTimer = null; if(!pendingMove) return;
  lastSend = Date.now();
  room.send({ type:"broadcast", event:"cursor", payload: pendingMove });
  pendingMove = null;
}
window.addEventListener("pointermove", e=>{
  if(e.pointerType!=="mouse" || !roomReady || !me.nick) return;
  pendingMove = { id: me.id, nick: me.nick, x: Math.round(e.pageX - wrapLeft()), y: Math.round(e.pageY) };
  const wait = 200 - (Date.now()-lastSend);          // 1초에 최대 5번만 보내서 무료 한도 안에서 동작
  if(wait<=0) sendMove(); else if(!sendTimer) sendTimer = setTimeout(sendMove, wait);
});
document.addEventListener("mouseleave", ()=>{ if(roomReady) room.send({ type:"broadcast", event:"cursor-leave", payload:{ id: me.id } }); });

room
  .on("presence", { event: "sync" }, ()=>{
    people = readPeople(); paintPeople();
    Object.keys(cursors).forEach(id=>{ if(!people.some(p=>p.id===id)) dropCursor(id); });
  })
  .on("broadcast", { event: "cursor" }, ({ payload })=> moveCursor(payload))
  .on("broadcast", { event: "cursor-leave" }, ({ payload })=>{ const c=cursors[payload.id]; if(c) c.el.classList.add("idle"); })
  .subscribe(status=>{ if(status==="SUBSCRIBED"){ roomReady = true; trackMe(); } });

renderMe();
if(!me.nick) askNick();
load();
</script>
</body>
</html>
